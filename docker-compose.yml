services:
  hr-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-copilot-app
    image: hr-copilot:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      # Persistent storage for uploaded HR policy documents
      - ./uploads:/app/uploads
      # Persistent storage for feedback and audit logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
