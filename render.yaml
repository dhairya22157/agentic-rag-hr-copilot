# ==============================================================================
# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: hr-ai-copilot
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PINECONE_INDEX_NAME
        value: ragbot
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: ADMIN_USERNAME
        value: admin
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
